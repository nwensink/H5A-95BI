<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Betrouwbaarheidsintervallen oefenen — HAVO 5 Wiskunde A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FCF3E3;
    --paper-line: rgba(61,46,34,0.06);
    --ink:#3D2E22;
    --ink-soft:#8E7C68;
    --sun:#F0A93E;
    --sun-soft:#FBE6BE;
    --leaf:#3E9B6E;
    --leaf-soft:#DCEEE3;
    --berry:#D6455F;
    --berry-soft:#F8DCE1;
    --card:#FFFDF8;
    --line:#E7D9BF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--paper-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px),
      var(--paper);
    background-size:28px 28px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:32px 20px 80px;}

  header{margin-bottom:20px;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--leaf);
    margin-bottom:6px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(26px,5vw,36px);
    margin:0 0 6px;
    line-height:1.1;
  }

  /* prominente instructiebanner */
  .instructie{
    display:flex;
    align-items:flex-start;
    gap:12px;
    background:var(--sun-soft);
    border:1.5px solid var(--sun);
    border-radius:12px;
    padding:14px 18px;
    margin:18px 0 22px;
  }
  .instructie .icoon{font-size:22px;line-height:1;}
  .instructie p{
    margin:0;
    font-size:15.5px;
    font-weight:600;
    line-height:1.5;
    color:#5C3F0F;
  }

  /* mode tabs */
  .modes{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap;}
  .mode-btn{
    font-family:'Inter',sans-serif;font-size:13px;font-weight:700;
    padding:9px 14px;border-radius:8px;border:1.5px solid var(--line);
    background:var(--card);color:var(--ink-soft);cursor:pointer;
  }
  .mode-btn.active{background:var(--berry);border-color:var(--berry);color:#fff;}

  .cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  .cat-btn{
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;
    padding:7px 12px;border-radius:7px;border:1.5px solid var(--line);
    background:var(--card);color:var(--ink-soft);cursor:pointer;
    display:flex;align-items:center;gap:7px;
  }
  .cat-btn:hover{border-color:var(--sun);}
  .cat-btn.active{background:var(--leaf-soft);border-color:var(--leaf);color:var(--leaf);}
  .cat-btn .score{font-family:'IBM Plex Mono',monospace;font-size:11px;opacity:.75;}

  /* formuleblad — de echte afbeeldingen van het lesmateriaal */
  .formuleblad{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px 18px 12px;
    margin-bottom:22px;
  }
  .formuleblad h2{
    font-family:'Fraunces',serif;
    font-size:16px;
    font-weight:700;
    margin:0 0 12px;
    color:var(--ink);
  }
  .fb-box{
    border:3px solid transparent;
    border-radius:6px;
    padding:2px;
    margin-bottom:10px;
    cursor:pointer;
    transition:.15s;
    background:#fff;
  }
  .fb-box img{display:block;width:100%;height:auto;border-radius:3px;}
  .fb-box:hover{border-color:var(--sun);}
  .fb-box.selected{border-color:var(--leaf);}
  .fb-box.wrong-choice{border-color:var(--berry);}

  math.wiskunde{font-size:1.15em;color:inherit;}

  /* question card */
  .card{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:26px 26px 22px;
  }
  .qnum{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);margin-bottom:10px;}
  .qtext{font-size:16px;line-height:1.6;margin-bottom:22px;}

  .answer-row{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin-bottom:6px;}
  .bracket{font-family:'IBM Plex Mono',monospace;font-size:26px;color:var(--ink-soft);padding:0 4px;}
  .sep{font-family:'IBM Plex Mono',monospace;font-size:16px;color:var(--ink-soft);padding:0 8px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:11.5px;color:var(--ink-soft);font-weight:600;}
  .field input{
    font-family:'IBM Plex Mono',monospace;font-size:17px;width:120px;
    padding:9px 10px;border-radius:7px;border:1.5px solid var(--line);
    background:#fff;color:var(--ink);
  }
  .field input:focus{outline:none;border-color:var(--sun);}
  .field input:disabled{background:#F3ECDC;color:var(--ink-soft);}
  .field input.correct{border-color:var(--leaf);background:var(--leaf-soft);}
  .field input.wrong{border-color:var(--berry);background:var(--berry-soft);}
  .gate-msg{font-size:12.5px;color:#B87A17;margin-top:4px;display:none;font-weight:600;}
  .gate-msg.show{display:block;}

  .btn-row{display:flex;gap:10px;margin-top:22px;align-items:center;flex-wrap:wrap;}
  button.primary{
    font-family:'Inter',sans-serif;font-weight:700;font-size:14px;
    padding:11px 20px;border-radius:8px;border:none;
    background:var(--berry);color:#fff;cursor:pointer;
  }
  button.primary:hover:not(:disabled){background:#B8354C;}
  button.ghost{
    font-family:'Inter',sans-serif;font-weight:600;font-size:13px;
    padding:10px 16px;border-radius:8px;border:1.5px solid var(--line);
    background:transparent;color:var(--ink-soft);cursor:pointer;
  }
  button.ghost:hover{border-color:var(--sun);color:#B8790E;}
  button:disabled{opacity:.4;cursor:default;}

  .feedback{margin-top:18px;padding:14px 16px;border-radius:9px;font-size:14.5px;line-height:1.55;display:none;}
  .feedback.show{display:block;}
  .feedback.correct{background:var(--leaf-soft);color:#1F5E42;border:1px solid #BFE0CE;}
  .feedback.wrong{background:var(--berry-soft);color:#8A2436;border:1px solid #EFC0C9;}
  .feedback .kop{font-weight:700;margin-bottom:4px;}

  .steps{margin-top:14px;padding:16px 18px;background:var(--sun-soft);border-radius:9px;display:none;}
  .steps.show{display:block;}
  .steps .stap-values{font-family:'IBM Plex Mono',monospace;font-size:14px;color:#5C3F0F;margin-bottom:10px;line-height:1.7;}
  .steps .formule-tak-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:nowrap;overflow-x:auto;background:#fffaf0;border:1px solid #E9C87E;border-radius:6px;padding:12px 16px;}
  .steps .stap-formule{font-family:'IBM Plex Mono',monospace;font-size:16px;color:#3d2b0b;white-space:nowrap;}
  .steps .tak-svg{flex-shrink:0;}
  .steps .tak-lines{display:flex;flex-direction:column;justify-content:space-between;gap:14px;padding:2px 0;}
  .steps .tak-lines div{font-family:'IBM Plex Mono',monospace;font-size:15px;color:#3d2b0b;white-space:nowrap;}
  .steps .stap-conclusie{font-family:'IBM Plex Mono',monospace;font-size:14.5px;font-weight:700;color:#3d2b0b;}
  .steps .advtekst{font-family:'Inter',sans-serif;font-size:13.5px;color:#5C3F0F;line-height:1.6;margin-bottom:8px;}

  footer{margin-top:22px;font-size:12.5px;color:var(--ink-soft);text-align:center;}
</style>
</head>

<script>
/* ================= HULPFUNCTIES ================= */
function fmt(x,d){ return x.toFixed(d).replace('.',','); }
function round(v,d){ const f=Math.pow(10,d); return Math.round((v+Number.EPSILON)*f)/f; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function randFloat(min,max,d){ return round(min+Math.random()*(max-min), d); }
const WOORD = ['nul','een','twee','drie','vier','vijf','zes','zeven','acht','negen','tien'];
function spellNum(n){
  if(Number.isInteger(n) && n>=0 && n<=10) return WOORD[n];
  return String(n);
}
function spellDec(d){
  if(d===1) return 'één decimaal';
  return `${spellNum(d)} decimalen`;
}

/* wiskundenotatie: horizontale breukstreep + wortel over de hele breuk */
function mathGemiddelde(xbarStr, sStr, nStr, teken){
  return `<math xmlns="http://www.w3.org/1998/Math/MathML" class="wiskunde"><mrow>
    <mn>${xbarStr}</mn><mo>${teken}</mo><mn>2</mn><mo>&middot;</mo>
    <mfrac><mn>${sStr}</mn><msqrt><mn>${nStr}</mn></msqrt></mfrac>
  </mrow></math>`;
}
function mathProportie(pStr, nStr, teken){
  return `<math xmlns="http://www.w3.org/1998/Math/MathML" class="wiskunde"><mrow>
    <mn>${pStr}</mn><mo>${teken}</mo><mn>2</mn><mo>&middot;</mo>
    <msqrt><mfrac>
      <mrow><mn>${pStr}</mn><mo>&middot;</mo><mo>(</mo><mn>1</mn><mo>&minus;</mo><mn>${pStr}</mn><mo>)</mo></mrow>
      <mn>${nStr}</mn>
    </mfrac></msqrt>
  </mrow></math>`;
}
function takSvg(){
  return `<svg class="tak-svg" width="60" height="64" viewBox="0 0 60 64">
    <line x1="2" y1="32" x2="54" y2="8" stroke="#B8790E" stroke-width="2"/>
    <line x1="2" y1="32" x2="54" y2="56" stroke="#B8790E" stroke-width="2"/>
    <text x="10" y="15" font-size="20" font-weight="700" fill="#B8790E" font-family="'IBM Plex Mono',monospace">&minus;</text>
    <text x="10" y="51" font-size="20" font-weight="700" fill="#B8790E" font-family="'IBM Plex Mono',monospace">+</text>
  </svg>`;
}

/* ================= CONTEXTEN — GEMIDDELDE ================= */
const GEMIDDELDE_CONTEXTS = [
  { onderwerp:'gemiddelde gewicht van een zak chips', eenheid:'gram', xbarR:[150,320], sR:[6,22],
    zin:(n,xbar,s)=>`Een supermarkt weegt zakken chips. Bij een steekproef van ${n} zakken is het gemiddelde gewicht ${fmt(xbar,1)} gram, met een standaardafwijking van ${fmt(s,1)} gram.` },
  { onderwerp:'gemiddelde levensduur van een batterij', eenheid:'uur', xbarR:[400,1300], sR:[20,90],
    zin:(n,xbar,s)=>`Een fabrikant van batterijen onderzoekt de levensduur. Van een steekproef van ${n} batterijen is de gemiddelde levensduur ${fmt(xbar,1)} uur, met een standaardafwijking van ${fmt(s,1)} uur.` },
  { onderwerp:'gemiddelde reistijd naar school', eenheid:'minuten', xbarR:[8,45], sR:[2,10],
    zin:(n,xbar,s)=>`Op een school wordt de reistijd naar school gemeten. Van een steekproef van ${n} leerlingen is de gemiddelde reistijd ${fmt(xbar,1)} minuten, met een standaardafwijking van ${fmt(s,1)} minuten.` },
  { onderwerp:'gemiddelde lengte van een tomatenplant', eenheid:'centimeter', xbarR:[35,130], sR:[3,16],
    zin:(n,xbar,s)=>`Een kwekerij onderzoekt de lengte van tomatenplanten. Bij een steekproef van ${n} planten is de gemiddelde lengte ${fmt(xbar,1)} centimeter, met een standaardafwijking van ${fmt(s,1)} centimeter.` },
  { onderwerp:'gemiddelde gewicht van een portie friet', eenheid:'gram', xbarR:[170,270], sR:[8,26],
    zin:(n,xbar,s)=>`Een cateraar schept porties friet. Van een steekproef van ${n} porties is het gemiddelde gewicht ${fmt(xbar,1)} gram, met een standaardafwijking van ${fmt(s,1)} gram.` },
  { onderwerp:'gemiddelde wachttijd bij de kassa', eenheid:'minuten', xbarR:[2,20], sR:[1,7],
    zin:(n,xbar,s)=>`Een supermarkt meet de wachttijd bij de kassa. Van een steekproef van ${n} klanten is de gemiddelde wachttijd ${fmt(xbar,1)} minuten, met een standaardafwijking van ${fmt(s,1)} minuten.` },
  { onderwerp:'gemiddeld aantal typfouten per pagina', eenheid:'', xbarR:[2,12], sR:[1,4], heelGetal:true,
    zin:(n,xbar,s)=>`Een uitgeverij telt typfouten in een manuscript. Bij een steekproef van ${n} pagina's is het gemiddelde aantal typfouten per pagina ${fmt(xbar,1)}, met een standaardafwijking van ${fmt(s,1)}.` }
];

function genGemiddeldeVraag(){
  const c = pick(GEMIDDELDE_CONTEXTS);
  const n = pick([25,30,40,50,64,80,100,120,150,180,200,250]);
  const xbar = randFloat(c.xbarR[0], c.xbarR[1], 1);
  const s = randFloat(c.sR[0], c.sR[1], 1);
  const decimals = c.heelGetal ? 0 : (Math.random() < 0.75 ? 1 : 2);
  const eenheidZin = c.eenheid ? ` in ${c.eenheid}` : '';
  const afrondZin = decimals===0 ? 'afgerond op een geheel getal' : `afgerond op ${spellDec(decimals)}`;
  const vraag = `Bereken het 95%-betrouwbaarheidsinterval van het ${c.onderwerp}${eenheidZin}, ${afrondZin}.`;
  const tekst = c.zin(n, xbar, s) + ' ' + vraag;

  const margin = 2*s/Math.sqrt(n);
  const low = round(xbar-margin, decimals);
  const high = round(xbar+margin, decimals);

  return {
    modus:'basis', categorie:'gemiddelde', formuleType:'gemiddelde',
    tekst, decimals, low, high,
    stepData:{ xbar, s, n, margin }
  };
}

/* ================= CONTEXTEN — PROPORTIE ================= */
const PROPORTIE_CONTEXTS = [
  { propOnderwerp:'rode auto\'s', pctOnderwerp:'auto\'s dat rood is',
    zin:(n,k)=>`Max is geïnteresseerd in de kleur van auto's die op de A16 rijden. Hij neemt een steekproef van ${n} auto's en noteert van al die auto's de kleur. Hiervan zijn er ${k} rood.` },
  { propOnderwerp:'scholieren die liever online les volgen', pctOnderwerp:'scholieren dat liever online les volgt',
    zin:(n,k)=>`Een enquêtebureau ondervraagt ${n} scholieren over hun voorkeur voor onlineonderwijs. Hiervan geven ${k} scholieren aan liever online les te volgen dan op school.` },
  { propOnderwerp:'onderdelen met een defect', pctOnderwerp:'onderdelen dat een defect heeft',
    zin:(n,k)=>`Bij een kwaliteitscontrole van een fabriek worden ${n} onderdelen gecontroleerd. Hiervan blijken ${k} onderdelen een defect te hebben.` },
  { propOnderwerp:'inwoners die regelmatig fietsen naar werk', pctOnderwerp:'inwoners dat regelmatig fietst naar werk',
    zin:(n,k)=>`Een gemeente onderzoekt het fietsgebruik onder haar inwoners. Van ${n} ondervraagde inwoners geven ${k} aan regelmatig de fiets te gebruiken voor woon-werkverkeer.` },
  { propOnderwerp:'potjes jam met een lekkende deksel', pctOnderwerp:'potjes jam dat een lekkende deksel heeft',
    zin:(n,k)=>`Een supermarkt controleert een levering potjes jam op een lekkende deksel. Van ${n} potjes blijkt bij ${k} potjes de deksel niet goed af te sluiten.` },
  { propOnderwerp:'leerlingen met een smartphone van hetzelfde merk', pctOnderwerp:'leerlingen dat een smartphone van hetzelfde merk heeft',
    zin:(n,k)=>`Op een school wordt onder ${n} leerlingen onderzocht welk merk smartphone ze gebruiken. Hiervan blijken ${k} leerlingen hetzelfde merk te gebruiken.` }
];

function genProportieVraag(alsPercentage){
  const c = pick(PROPORTIE_CONTEXTS);
  const n = randInt(8,20)*25;
  const p0 = randFloat(0.04,0.55,3);
  const k = Math.max(1, Math.round(p0*n));
  const p = k/n;

  const decimals = alsPercentage ? 1 : 3;
  const vraag = alsPercentage
    ? `Bereken het 95%-betrouwbaarheidsinterval van het percentage ${c.pctOnderwerp}, afgerond op ${spellDec(decimals)}.`
    : `Bereken het 95%-betrouwbaarheidsinterval van de proportie ${c.propOnderwerp}, afgerond op ${spellDec(decimals)}.`;
  const tekst = c.zin(n, spellNum(k)) + ' ' + vraag;

  const margin = 2*Math.sqrt(p*(1-p)/n);
  let low = p-margin, high = p+margin;
  if(alsPercentage){ low*=100; high*=100; }
  low = round(low, decimals); high = round(high, decimals);

  return {
    modus:'basis', categorie: alsPercentage?'percentage':'proportie', formuleType:'proportie',
    tekst, decimals, low, high,
    stepData:{ p, k, n, margin, alsPercentage }
  };
}

/* ================= GEVORDERD ================= */
function genGevorderdProportie(){
  const c = pick(PROPORTIE_CONTEXTS);
  const correctN = pick([80,100,150,200,250,300,400,500,600]);
  const p = randFloat(0.05,0.5,3);
  const margin = 2*Math.sqrt(p*(1-p)/correctN);
  const kantOnder = Math.random() < 0.5;
  const boundExact = kantOnder ? p-margin : p+margin;
  const bound = round(boundExact, 4);
  const grensNaam = kantOnder ? 'ondergrens' : 'bovengrens';

  const tekst = `Bij een steekproef naar ${c.propOnderwerp} is de gevonden proportie gelijk aan ${fmt(p,3)}. `+
    `De ${grensNaam} van het bijbehorende 95%-betrouwbaarheidsinterval is ${fmt(bound,4)}. `+
    `Bereken de steekproefomvang die bij dit interval hoort, afgerond op een geheel getal.`;

  const berekendN = Math.round(4*p*(1-p)/Math.pow(bound-p,2));

  return {
    modus:'gevorderd', categorie:'gevorderd', formuleType:'proportie',
    tekst, decimals:0, antwoord:berekendN,
    stepData:{ p, bound, kantOnder, type:'proportie' }
  };
}

function genGevorderdGemiddelde(){
  const c = pick(GEMIDDELDE_CONTEXTS);
  const correctN = pick([20,25,30,40,50,64,80,100,150]);
  const xbar = randFloat(c.xbarR[0], c.xbarR[1], 1);
  const s = randFloat(c.sR[0], c.sR[1], 1);
  const margin = 2*s/Math.sqrt(correctN);
  const kantOnder = Math.random() < 0.5;
  const boundExact = kantOnder ? xbar-margin : xbar+margin;
  const bound = round(boundExact, 2);
  const grensNaam = kantOnder ? 'ondergrens' : 'bovengrens';
  const eenheidZin = c.eenheid ? ` ${c.eenheid}` : '';

  const tekst = `Bij een steekproef is het gevonden gemiddelde voor het ${c.onderwerp} gelijk aan ${fmt(xbar,1)}${eenheidZin}, met een standaardafwijking van ${fmt(s,1)}${eenheidZin}. `+
    `De ${grensNaam} van het bijbehorende 95%-betrouwbaarheidsinterval is ${fmt(bound,2)}${eenheidZin}. `+
    `Bereken de steekproefomvang die bij dit interval hoort, afgerond op een geheel getal.`;

  const berekendN = Math.round(Math.pow(2*s/(bound-xbar),2));

  return {
    modus:'gevorderd', categorie:'gevorderd', formuleType:'gemiddelde',
    tekst, decimals:0, antwoord:berekendN,
    stepData:{ xbar, s, bound, kantOnder, type:'gemiddelde' }
  };
}

/* ================= VRAAG-GENERATOR PER TAB ================= */
function genereerVraag(tab){
  if(tab==='gevorderd') return Math.random()<0.5 ? genGevorderdProportie() : genGevorderdGemiddelde();
  if(tab==='gemiddelde') return genGemiddeldeVraag();
  if(tab==='proportie') return genProportieVraag(false);
  if(tab==='percentage') return genProportieVraag(true);
  const r = Math.random();
  if(r<0.34) return genGemiddeldeVraag();
  if(r<0.67) return genProportieVraag(false);
  return genProportieVraag(true);
}

/* ================= STATE ================= */
const TABS = [
  {key:'gemengd', label:'gemengd'},
  {key:'gemiddelde', label:'gemiddelde'},
  {key:'proportie', label:'proportie'},
  {key:'percentage', label:'percentage'}
];
const MODES = [
  {key:'basis', label:'basisopgaven'},
  {key:'gevorderd', label:'voor gevorderden'}
];

let huidigeMode = 'basis';
let huidigeTab = 'gemengd';
let voortgang = {gemiddelde:{goed:0,totaal:0}, proportie:{goed:0,totaal:0}, percentage:{goed:0,totaal:0}, gevorderd:{goed:0,totaal:0}};
let huidigeVraag = null;
let selectedFormule = null;
let beantwoord = false;
let vraagTeller = 0;

function renderModes(){
  document.getElementById('modes').innerHTML = MODES.map(m=>
    `<button class="mode-btn ${m.key===huidigeMode?'active':''}" onclick="setMode('${m.key}')">${m.label}</button>`
  ).join('');
}
function setMode(m){
  huidigeMode = m;
  renderModes();
  document.getElementById('cats').style.display = m==='basis' ? 'flex' : 'none';
  nextQuestion(false, true);
}

function renderCats(){
  if(huidigeMode!=='basis'){ document.getElementById('cats').innerHTML=''; return; }
  document.getElementById('cats').innerHTML = TABS.map(t=>{
    let score = '';
    if(t.key==='gemengd'){
      const g = voortgang.gemiddelde.goed+voortgang.proportie.goed+voortgang.percentage.goed;
      const tot = voortgang.gemiddelde.totaal+voortgang.proportie.totaal+voortgang.percentage.totaal;
      score = `${g}/${tot}`;
    } else {
      score = `${voortgang[t.key].goed}/${voortgang[t.key].totaal}`;
    }
    return `<button class="cat-btn ${t.key===huidigeTab?'active':''}" onclick="setTab('${t.key}')">
      <span>${t.label}</span><span class="score">${score}</span>
    </button>`;
  }).join('');
}
function setTab(t){ huidigeTab = t; renderCats(); nextQuestion(false, true); }

/* ================= FORMULEBLAD SELECTIE ================= */
document.getElementById('fbProportie').addEventListener('click', ()=>selectFormule('proportie'));
document.getElementById('fbGemiddelde').addEventListener('click', ()=>selectFormule('gemiddelde'));

function selectFormule(type){
  if(beantwoord) return;
  selectedFormule = type;
  document.getElementById('fbProportie').classList.toggle('selected', type==='proportie');
  document.getElementById('fbGemiddelde').classList.toggle('selected', type==='gemiddelde');
  document.getElementById('fbProportie').classList.remove('wrong-choice');
  document.getElementById('fbGemiddelde').classList.remove('wrong-choice');
  document.getElementById('gateMsg').classList.remove('show');
  activeerVelden(true);
  updateCheckBtn();
}

/* ================= ANTWOORDVELDEN RENDEREN ================= */
function renderAnswerRow(v){
  const row = document.getElementById('answerRow');
  if(v.modus==='gevorderd'){
    row.innerHTML = `
      <div class="field">
        <label>steekproefomvang</label>
        <input type="text" id="inA" inputmode="numeric" placeholder="0" disabled>
      </div>`;
  } else {
    const sep = v.decimals>0 ? ';' : ',';
    row.innerHTML = `
      <span class="bracket">[</span>
      <div class="field"><label>ondergrens</label><input type="text" id="inA" inputmode="decimal" placeholder="0" disabled></div>
      <span class="sep">${sep}</span>
      <div class="field"><label>bovengrens</label><input type="text" id="inB" inputmode="decimal" placeholder="0" disabled></div>
      <span class="bracket">]</span>`;
  }
  const a = document.getElementById('inA');
  a.addEventListener('input', updateCheckBtn);
  a.addEventListener('keydown', e=>{ if(e.key==='Enter'){ const b=document.getElementById('inB'); if(b) b.focus(); else checkAnswer(); }});
  const b = document.getElementById('inB');
  if(b){ b.addEventListener('input', updateCheckBtn); b.addEventListener('keydown', e=>{ if(e.key==='Enter') checkAnswer(); }); }
}

function activeerVelden(actief){
  const a = document.getElementById('inA'); if(a) a.disabled = !actief;
  const b = document.getElementById('inB'); if(b) b.disabled = !actief;
  if(actief && a) a.focus();
}

function updateCheckBtn(){
  const a = document.getElementById('inA');
  const b = document.getElementById('inB');
  const gevuld = a && a.value.trim()!=='' && (!b || b.value.trim()!=='');
  document.getElementById('checkBtn').disabled = !(selectedFormule && gevuld);
}

/* ================= VRAAG LADEN ================= */
function loadQuestion(){
  beantwoord = false;
  selectedFormule = null;
  vraagTeller++;
  huidigeVraag = genereerVraag(huidigeMode==='gevorderd' ? 'gevorderd' : huidigeTab);

  document.getElementById('qnum').textContent = `Opgave ${vraagTeller}`;
  document.getElementById('qtext').innerHTML = huidigeVraag.tekst.replace(' Bereken', '<br>Bereken');

  document.getElementById('fbProportie').classList.remove('selected','wrong-choice');
  document.getElementById('fbGemiddelde').classList.remove('selected','wrong-choice');
  document.getElementById('gateMsg').classList.remove('show');

  renderAnswerRow(huidigeVraag);
  updateCheckBtn();

  document.getElementById('feedback').className='feedback';
  document.getElementById('steps').className='steps';
  document.getElementById('steps').innerHTML = renderSteps(huidigeVraag);
  document.getElementById('hintBtn').textContent = 'toon uitwerking';

  document.getElementById('checkBtn').style.display='inline-block';
  document.getElementById('skipBtn').style.display='inline-block';
  document.getElementById('nextBtn').style.display='none';
}

function toggleSteps(){
  const st = document.getElementById('steps');
  st.classList.toggle('show');
  document.getElementById('hintBtn').textContent = st.classList.contains('show') ? 'verberg uitwerking' : 'toon uitwerking';
}

function parseNum(str){
  if(str===undefined||str===null) return NaN;
  const s = str.trim().replace(',', '.');
  if(s==='') return NaN;
  return parseFloat(s);
}

/* ================= CONTROLEREN ================= */
function checkAnswer(){
  if(beantwoord) return;
  if(!selectedFormule){
    document.getElementById('gateMsg').classList.add('show');
    return;
  }
  const v = huidigeVraag;
  const fb = document.getElementById('feedback');
  const formuleGoed = selectedFormule === v.formuleType;

  document.getElementById('fbProportie').classList.remove('selected','wrong-choice');
  document.getElementById('fbGemiddelde').classList.remove('selected','wrong-choice');
  const gekozenBox = selectedFormule==='proportie' ? document.getElementById('fbProportie') : document.getElementById('fbGemiddelde');
  gekozenBox.classList.add(formuleGoed ? 'selected' : 'wrong-choice');

  const a = document.getElementById('inA');
  const b = document.getElementById('inB');

  let juist = formuleGoed;
  let uitleg = '';

  if(v.modus==='gevorderd'){
    const userN = parseNum(a.value);
    const nGoed = Math.round(userN) === v.antwoord;
    juist = juist && nGoed;
    a.className = nGoed ? 'correct' : 'wrong';
    a.disabled = true;
    if(!formuleGoed) uitleg = 'Je hebt de verkeerde formule van het formuleblad gekozen voor dit type opgave.';
    else if(!nGoed) uitleg = `De juiste steekproefomvang is ${v.antwoord}.`;
  } else {
    const userLow = parseNum(a.value);
    const userHigh = parseNum(b.value);
    const lowOK = round(userLow, v.decimals) === v.low;
    const highOK = round(userHigh, v.decimals) === v.high;
    juist = juist && lowOK && highOK;
    a.className = lowOK ? 'correct' : 'wrong';
    b.className = highOK ? 'correct' : 'wrong';
    a.disabled = true; b.disabled = true;

    if(!formuleGoed){
      uitleg = 'Je hebt de verkeerde formule van het formuleblad gekozen voor dit type opgave.';
    } else if(!juist){
      if(round(userLow,v.decimals)===v.high && round(userHigh,v.decimals)===v.low){
        uitleg = 'Je onder- en bovengrens staan verwisseld — de ondergrens is het kleinste getal, de bovengrens het grootste.';
      } else if(v.categorie==='percentage'){
        const alsProp = {low:round(userLow*100,v.decimals), high:round(userHigh*100,v.decimals)};
        if(alsProp.low===v.low && alsProp.high===v.high) uitleg = 'Je hebt de proportie goed berekend, maar vergeten om te zetten naar een percentage (keer honderd).';
      } else if(v.categorie==='proportie'){
        const alsPct = {low:round(userLow/100,v.decimals), high:round(userHigh/100,v.decimals)};
        if(alsPct.low===v.low && alsPct.high===v.high) uitleg = 'Hier wordt naar de proportie gevraagd, niet naar het percentage — controleer of je per ongeluk keer honderd hebt gedaan.';
      }
      if(!uitleg) uitleg = 'Controleer de getallen die je hebt gebruikt en de tussenstappen — bekijk eventueel de uitwerking hieronder.';
    }
  }

  beantwoord = true;
  if(v.categorie in voortgang){
    voortgang[v.categorie].totaal++;
    if(juist) voortgang[v.categorie].goed++;
  }
  renderCats();

  if(juist){
    fb.className='feedback correct show';
    const antwoordTxt = v.modus==='gevorderd' ? `n = ${v.antwoord}` : `[${fmt(v.low,v.decimals)}${v.decimals>0?';':','} ${fmt(v.high,v.decimals)}]`;
    fb.innerHTML = `<div class="kop">Goed!</div>${antwoordTxt}`;
  } else {
    fb.className='feedback wrong show';
    const antwoordTxt = v.modus==='gevorderd' ? `n = ${v.antwoord}` : `[${fmt(v.low,v.decimals)}${v.decimals>0?';':','} ${fmt(v.high,v.decimals)}]`;
    fb.innerHTML = `<div class="kop">Niet helemaal juist</div>Het juiste antwoord is ${antwoordTxt}.<br>${uitleg}`;
  }

  document.getElementById('checkBtn').style.display='none';
  document.getElementById('skipBtn').style.display='none';
  document.getElementById('nextBtn').style.display='inline-block';
}

function nextQuestion(overslaan, herstart){
  if(herstart){ vraagTeller = 0; }
  loadQuestion();
}

/* ================= UITWERKING (in stijl van het formuleblad) ================= */
function renderSteps(v){
  if(v.modus==='gevorderd'){
    const d = v.stepData;
    if(d.type==='proportie'){
      return `<div class="advtekst">Tip: gebruik je grafische rekenmachine. Vul in:<br>
        Y₁ = ${fmt(d.p,3)} ${d.kantOnder?'−':'+'} 2·√(${fmt(d.p,3)}(1−${fmt(d.p,3)})/X)<br>
        Y₂ = ${fmt(d.bound,4)}<br>
        Bepaal met intersect het snijpunt en rond X (de steekproefomvang) af op een geheel getal.</div>
        <div class="stap-conclusie">Steekproefomvang ≈ ${v.antwoord}</div>`;
    } else {
      return `<div class="advtekst">Tip: gebruik je grafische rekenmachine. Vul in:<br>
        Y₁ = ${fmt(d.xbar,1)} ${d.kantOnder?'−':'+'} 2·(${fmt(d.s,1)}/√X)<br>
        Y₂ = ${fmt(d.bound,2)}<br>
        Bepaal met intersect het snijpunt en rond X (de steekproefomvang) af op een geheel getal.</div>
        <div class="stap-conclusie">Steekproefomvang ≈ ${v.antwoord}</div>`;
    }
  }

  const d = v.stepData;
  if(v.categorie==='gemiddelde'){
    const xbarS = fmt(d.xbar,1), sS = fmt(d.s,1), nS = String(d.n);
    return `
      <div class="stap-values">X̄ = ${xbarS}<br>S = ${sS}<br>n = ${nS}</div>
      <div class="formule-tak-row">
        <div class="stap-formule">${mathGemiddelde(xbarS,sS,nS,'±')}</div>
        ${takSvg()}
        <div class="tak-lines">
          <div>${fmt(v.low,v.decimals)}</div>
          <div>${fmt(v.high,v.decimals)}</div>
        </div>
      </div>
      <div class="stap-conclusie">Het gevraagde interval is [${fmt(v.low,v.decimals)}${v.decimals>0?';':','} ${fmt(v.high,v.decimals)}]</div>`;
  } else {
    const pS = fmt(d.p,4), nS = String(d.n);
    const propLow = round(d.p - d.margin, 4);
    const propHigh = round(d.p + d.margin, 4);
    const pctNote = d.alsPercentage ? '<div style="margin-top:8px;">Reken eerst als proportie, en zet het antwoord daarna om naar een percentage (keer honderd).</div>' : '';
    return `
      <div class="stap-values">p = ${d.k}/${d.n} ≈ ${pS}<br>n = ${nS}</div>
      <div class="formule-tak-row">
        <div class="stap-formule">${mathProportie(pS,nS,'±')}</div>
        ${takSvg()}
        <div class="tak-lines">
          <div>${fmt(propLow,4)}</div>
          <div>${fmt(propHigh,4)}</div>
        </div>
      </div>
      ${pctNote}
      <div class="stap-conclusie">Het gevraagde interval is [${fmt(v.low,v.decimals)}${v.decimals>0?';':','} ${fmt(v.high,v.decimals)}]</div>`;
  }
}

/* ================= START ================= */
renderModes();
renderCats();
loadQuestion();
</script>
</body>
</html>
